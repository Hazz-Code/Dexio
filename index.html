<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dexio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Clash+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-tap-highlight-color: transparent; }
      body { background: #080C14; font-family: 'DM Sans', sans-serif; color: #F0F4FF; overflow-x: hidden; }
      ::-webkit-scrollbar { width: 0; height: 0; }

      /* Rarity animations */
      @keyframes legendaryPulse {
        0%, 100% { box-shadow: 0 0 20px #FCD34D88, 0 0 40px #FCD34D44, inset 0 0 20px #FCD34D22; }
        50% { box-shadow: 0 0 35px #FCD34Daa, 0 0 70px #FCD34D66, inset 0 0 30px #FCD34D44; }
      }
      @keyframes epicPulse {
        0%, 100% { box-shadow: 0 0 16px #A78BFA88, 0 0 32px #A78BFA44; }
        50% { box-shadow: 0 0 28px #A78BFAaa, 0 0 55px #A78BFA66; }
      }
      @keyframes rarePulse {
        0%, 100% { box-shadow: 0 0 12px #60A5FA66; }
        50% { box-shadow: 0 0 20px #60A5FA99; }
      }
      @keyframes legendaryFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        33% { transform: translateY(-4px) rotate(1deg); }
        66% { transform: translateY(-2px) rotate(-1deg); }
      }
      @keyframes epicFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes particleDrift {
        0% { transform: translateY(0) scale(1); opacity: 0.8; }
        100% { transform: translateY(-30px) scale(0); opacity: 0; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pop {
        0% { transform: scale(0.75); opacity: 0; }
        70% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes borderSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rainbowBorder {
        0% { border-color: #FCD34D; }
        25% { border-color: #F472B6; }
        50% { border-color: #60A5FA; }
        75% { border-color: #4ADE80; }
        100% { border-color: #FCD34D; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
